[project]
name = "pixelman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "pytelegrambotapi>=4.37.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 120
exclude = [
	"**/migrations/**",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]


[tool.ruff.format]
quote-style = "single"
